name: Export kit

# Public repo: holds NO deploy credentials. Dispatches scaffold's
# export-kit-release.yml, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app. See scaffold
# docs/runbook/export-kits.md.

# A push runs the test suite. The parity summary renders every catalog case on
# the CPU and takes over ten minutes, so it runs weekly and on manual dispatch,
# and only a green run of both dispatches the kit release. filter/crt is the
# operator-accepted approximation documented in docs/CRT-PARITY.md: it is
# reported as FAIL every run, and any other failing effect fails the job.
on:
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 1'
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - "!export-kit/README-generation.md"
      - ".github/workflows/export-kit.yml"
      - "LICENSE"
      - "src/**"
      - "bin/**"
      - "test/**"
      - "scripts/**"
      - "parity/**"
      - "package.json"
      - "package-lock.json"

permissions: {}

concurrency:
  group: export-kit-${{ github.ref }}-${{ github.event_name == 'push' && 'gate' || 'full' }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test

  parity:
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Parity summary (only the accepted filter/crt approximation may fail)
        run: |
          ./scripts/parity-summary 2>&1 | tee "$RUNNER_TEMP/parity-summary.log"
          grep -q '^PARITY-SUMMARY ' "$RUNNER_TEMP/parity-summary.log"
          fails=$(grep -E '^FAIL ' "$RUNNER_TEMP/parity-summary.log" | awk '{print $2}' | sort | tr '\n' ' ')
          if [ "$fails" != "filter/crt " ]; then
            echo "::error::failing effects: ${fails:-none} (only filter/crt, docs/CRT-PARITY.md, may fail)"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-summary-${{ github.sha }}
          path: ${{ runner.temp }}/parity-summary.log

  dispatch:
    needs: [test, parity]
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # scaffold mints a new kit version for every dispatch, so a weekly run on
      # an unchanged main must not release the same SHA again.
      - name: Skip a SHA that is already released
        id: released
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '$2 ~ /\^\{\}$/ { print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scaffold-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch export-kit-release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run export-kit-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f kit=cpu \
            -f sha=${{ github.sha }}
