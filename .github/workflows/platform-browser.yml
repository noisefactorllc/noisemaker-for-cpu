name: Platform browser qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-browser.yml'
      - 'scripts/browser-check.mjs'
      - 'test/**'
      - 'examples/browser/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Record exact Windows source and tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'cpu-platform-windows'
          New-Item -ItemType Directory -Force $receipt | Out-Null
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA) { throw "Checkout $source differs from workflow source $env:GITHUB_SHA" }
          @(
            "source=$source"
            "os=$([System.Environment]::OSVersion.VersionString)"
            "node=$(node --version)"
          ) | Tee-Object -FilePath (Join-Path $receipt 'identity.log')
          if ((node --version) -notmatch '^v26\.') { throw 'Node 26 required' }
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Run Windows unit suite and browser check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:RUNNER_TEMP 'cpu-platform-windows'
          & npm test 2>&1 | Tee-Object -FilePath (Join-Path $receipt 'test.log')
          $testExit = $LASTEXITCODE
          "exit_code=$testExit" | Add-Content (Join-Path $receipt 'test.log')
          if ($testExit -ne 0) { throw "npm test exited $testExit" }
          & node scripts/browser-check.mjs --browser chromium 2>&1 | Tee-Object -FilePath (Join-Path $receipt 'browser.log')
          $browserExit = $LASTEXITCODE
          "exit_code=$browserExit" | Add-Content (Join-Path $receipt 'browser.log')
          if ($browserExit -ne 0) { throw "Windows browser check exited $browserExit" }
          $line = Get-Content (Join-Path $receipt 'browser.log') | Where-Object { $_ -match '^BROWSER-CHECK ' } | Select-Object -Last 1
          if (-not $line) { throw 'Browser check result missing' }
          $result = $line.Substring(14) | ConvertFrom-Json
          if (-not $result.pass -or $result.platform -ne 'win32') { throw 'Windows browser result did not pass' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpu-windows-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-platform-windows/
          if-no-files-found: warn

  safari:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Record exact macOS source and Safari tools
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/cpu-platform-safari"
          mkdir -p "$receipt"
          source=$(git rev-parse HEAD)
          test "$source" = "$GITHUB_SHA"
          {
            echo "source=$source"
            sw_vers
            node --version
            /usr/bin/safaridriver --version
          } | tee "$receipt/identity.log"
          [[ "$(node --version)" == v26.* ]]
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Enable Safari WebDriver on this ephemeral runner
        shell: bash
        run: sudo /usr/bin/safaridriver --enable
      - name: Run macOS unit suite and real Safari browser check
        shell: bash
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/cpu-platform-safari"
          npm test 2>&1 | tee "$receipt/test.log"
          test_exit=${PIPESTATUS[0]}
          echo "exit_code=$test_exit" | tee -a "$receipt/test.log"
          test "$test_exit" -eq 0 || exit "$test_exit"
          node scripts/browser-check.mjs --browser safari 2>&1 | tee "$receipt/browser.log"
          browser_exit=${PIPESTATUS[0]}
          echo "exit_code=$browser_exit" | tee -a "$receipt/browser.log"
          test "$browser_exit" -eq 0 || exit "$browser_exit"
          grep -F '"pass":true' "$receipt/browser.log"
          grep -F '"platform":"darwin"' "$receipt/browser.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpu-safari-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-platform-safari/
          if-no-files-found: warn

  webkit-floor:
    # The README's declared Safari floor is 15.4. No hosted macOS image still
    # ships Safari 15.4, so this leg runs the same demo check on the nearest
    # available WebKit build: Playwright 1.22.2's WebKit (browsers.json
    # revision 1641, browserVersion "15.4"), preinstalled in its focal image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.22.2-focal@sha256:9b3f813c7f76c0f562244b3c99423755405cd43b413941f04d99f20ff604286c
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install the C runtime library Node 26 links against
        # The focal image predates Node 26, whose binary needs libatomic.so.1.
        run: apt-get update && apt-get install -y --no-install-recommends libatomic1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: npm
      - name: Record exact source, image and WebKit build
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/cpu-platform-webkit"
          mkdir -p "$receipt"
          {
            echo "source=$GITHUB_SHA"
            grep -E '^(NAME|VERSION)=' /etc/os-release
            node --version
            ls -d /ms-playwright/webkit-*
          } | tee "$receipt/identity.log"
          [[ "$(node --version)" == v26.* ]]
          test -d /ms-playwright/webkit-1641
      - run: npm ci --ignore-scripts --bin-links=false
      - name: Install the Playwright client that drives WebKit 1641
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/playwright" --no-save --ignore-scripts playwright-core@1.22.2
      - name: Run the demo browser check on WebKit 15.4
        shell: bash
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/cpu-platform-webkit"
          PLAYWRIGHT_BROWSERS_PATH=/ms-playwright node scripts/browser-check.mjs --browser webkit \
            --playwright "$RUNNER_TEMP/playwright/node_modules/playwright-core" 2>&1 | tee "$receipt/browser.log"
          browser_exit=${PIPESTATUS[0]}
          echo "exit_code=$browser_exit" | tee -a "$receipt/browser.log"
          test "$browser_exit" -eq 0 || exit "$browser_exit"
          grep -F '"pass":true' "$receipt/browser.log"
          grep -F '"product":"WebKit 15.4"' "$receipt/browser.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpu-webkit-floor-browser-${{ github.sha }}
          path: ${{ runner.temp }}/cpu-platform-webkit/
          if-no-files-found: warn
