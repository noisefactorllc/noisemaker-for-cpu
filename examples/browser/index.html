<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noisemaker-cpu — frame bench</title>
  <style>
    :root {
      color-scheme: dark;
      --housing: #17162b;
      --housing-raised: #24223f;
      --paper: #e9e8f4;
      --paper-dim: #a7a5bd;
      --apricot: #ff8a5b;
      --iris: #746cff;
      --mint: #a8f0d0;
      --graphite: #5a5968;
      --scan: 0%;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: var(--housing);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--housing); color: var(--paper); }
    button, select, textarea { font: inherit; }
    .bench { min-height: 100vh; display: grid; grid-template-columns: minmax(21rem, 0.82fr) minmax(24rem, 1.18fr); }
    .controls { display: flex; flex-direction: column; min-height: 100vh; padding: clamp(1.4rem, 3vw, 3rem); border-right: 1px solid var(--graphite); }
    .eyebrow, .telemetry, label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow { color: var(--mint); }
    h1 { max-width: 10ch; margin: .7rem 0 .55rem; font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif; font-size: clamp(3.2rem, 7vw, 7.6rem); font-stretch: condensed; font-weight: 800; letter-spacing: -.055em; line-height: .78; text-transform: uppercase; }
    .intro { max-width: 38rem; margin: 0 0 2rem; color: var(--paper-dim); line-height: 1.55; }
    .editor-shell { position: relative; flex: 1; min-height: 24rem; border: 1px solid var(--graphite); background: #101020; }
    .editor-shell::before { content: "POLYMORPHIC / CPU"; position: absolute; z-index: 1; top: .8rem; right: .9rem; color: var(--graphite); font: .62rem ui-monospace, monospace; letter-spacing: .12em; pointer-events: none; }
    textarea { width: 100%; height: 100%; min-height: 24rem; resize: vertical; border: 0; outline: 0; padding: 2.8rem 1.2rem 1.2rem; background: transparent; color: var(--paper); caret-color: var(--apricot); font: .82rem/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 2; }
    textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--iris); }
    .actions { display: grid; grid-template-columns: 1fr auto auto; gap: .65rem; margin-top: .75rem; }
    button, select { min-height: 2.8rem; border: 1px solid var(--graphite); border-radius: 0; padding: 0 .95rem; background: var(--housing-raised); color: var(--paper); }
    button { cursor: pointer; font-weight: 750; }
    button.primary { border-color: var(--apricot); background: var(--apricot); color: #211523; }
    button:hover { border-color: var(--paper); }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .62; }
    .stage { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 100vh; padding: clamp(1rem, 4vw, 4rem); background: var(--paper); color: var(--housing); }
    .stage::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--scan); background: color-mix(in srgb, var(--iris) 9%, transparent); border-right: 1px solid color-mix(in srgb, var(--iris) 55%, transparent); pointer-events: none; transition: width 90ms linear; }
    .frame { position: relative; width: min(78vh, 100%); aspect-ratio: 1; padding: clamp(.75rem, 2vw, 1.4rem); background: #d4d2df; box-shadow: 1.5rem 1.5rem 0 #c2bfd2; }
    canvas { display: block; width: 100%; height: 100%; background: repeating-conic-gradient(#b7b4c5 0 25%, #d7d5e1 0 50%) 50% / 1rem 1rem; }
    .telemetry { position: absolute; display: flex; justify-content: space-between; gap: 2rem; right: 0; bottom: -2.3rem; left: 0; color: var(--graphite); }
    .telemetry strong { color: var(--housing); font-weight: 800; }
    .fault { color: #ff4f64; }
    @media (max-width: 820px) {
      .bench { grid-template-columns: 1fr; }
      .controls { min-height: auto; border-right: 0; border-bottom: 1px solid var(--graphite); }
      .stage { min-height: 70vh; padding-bottom: 4.5rem; }
      .actions { grid-template-columns: 1fr 1fr; }
      .actions .primary { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) { .stage::before { transition: none; } }
  </style>
</head>
<body>
  <main class="bench">
    <section class="controls">
      <div class="eyebrow">One frame / no GPU</div>
      <h1>CPU shader bench</h1>
      <p class="intro">Edit the chain, then let the processor draw every pixel. The raster clock moves once per completed tile.</p>
      <div class="editor-shell"><textarea id="source" spellcheck="false" aria-label="Polymorphic DSL source"></textarea></div>
      <div class="actions">
        <button class="primary" id="render">Render one frame</button>
        <select id="size" aria-label="Frame size"><option>128</option><option selected>256</option><option>512</option></select>
        <button id="seed">New seed</button>
      </div>
    </section>
    <section class="stage" id="stage" aria-live="polite">
      <div class="frame">
        <canvas id="canvas" width="256" height="256"></canvas>
        <div class="telemetry"><span id="status">Ready</span><strong id="timing">CPU / idle</strong></div>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
