<!DOCTYPE html>
<html lang="en" data-theme="gray-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noisemaker CPU Demo</title>
    <meta name="description" content="Build a Polymorphic-DSL effect pipeline and render it on the CPU with noisemaker-cpu — no GPU required." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23101522'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%23a5b8ff'/%3E%3C/svg%3E" />
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/nunito/Nunito-Blank.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono-Blank.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Nunito Blank'; src: url('https://fonts.noisefactor.io/fonts/nunito/Nunito-Blank.woff2') format('woff2'); }
      @font-face { font-family: 'Noto Sans Mono Blank'; src: url('https://fonts.noisefactor.io/fonts/noto-sans-mono/NotoSansMono-Blank.woff2') format('woff2'); }
    </style>
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0.9.0/styles/index.css" />
    <link rel="stylesheet" href="https://handfish.noisefactor.io/0.9.0/styles/themes/gray.css" />
    <link rel="stylesheet" href="./common-colors.css" />
    <link rel="stylesheet" href="./common-layout.css" />
    <link rel="stylesheet" href="./layout.css" />
</head>
<body class="fixed-canvas-mode">
    <div id="loading" class="loading">loading effects…</div>

    <div id="app-container" style="display: none;">
        <div id="mobile-divider"></div>

        <div id="left-panel">
            <!-- Header + global render settings -->
            <div class="shader-effect hf-panel" id="pipeline-effect">
                <div class="effect-title" id="pipeline-title">
                    <span class="effect-title-text">noisemaker cpu demo</span>
                    <span style="flex: 1;"></span>
                    <button id="code-btn" class="hf-action-btn tooltip" data-title="Show the generated DSL" aria-label="Show the generated DSL">code</button>
                </div>
                <div class="effect-content">
                    <div class="render-settings">
                        <label class="setting">
                            <span class="setting-label">size</span>
                            <select id="resolution" class="hf-select">
                                <option value="128">128</option>
                                <option value="256" selected>256</option>
                                <option value="384">384</option>
                                <option value="512">512</option>
                            </select>
                        </label>
                        <label class="setting">
                            <span class="setting-label">seed</span>
                            <span class="seed-controls">
                                <input id="seed" class="hf-number" type="number" step="1" min="0" value="11" />
                                <button id="seed-randomize" class="hf-action-btn tooltip" data-title="Random seed" aria-label="Random seed">↻</button>
                            </span>
                        </label>
                        <label class="setting">
                            <span class="setting-label">time</span>
                            <span id="time-control" class="time-control"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Generator + filter chain (built by demo.js) -->
            <div id="effect-controls-container"></div>

            <!-- Add a filter -->
            <div class="shader-effect hf-panel" id="add-effect-panel">
                <div class="effect-content">
                    <effect-select id="add-effect"></effect-select>
                </div>
            </div>

            <!-- DSL code view (collapsed by default) -->
            <div class="shader-effect hf-panel collapsed" id="code-effect">
                <div class="effect-title" id="code-title">
                    <span class="effect-title-text">dsl</span>
                    <span style="flex: 1;"></span>
                    <span id="dsl-mode" class="hf-text-dim hf-text-xs"></span>
                </div>
                <div class="effect-content">
                    <textarea id="dsl-editor" class="dsl-editor" spellcheck="false" rows="8"></textarea>
                    <div class="dsl-actions">
                        <button id="dsl-run" class="hf-btn hf-btn-primary">run</button>
                        <button id="dsl-revert" class="hf-btn">back to pipeline</button>
                    </div>
                </div>
            </div>

            <div class="noisemaker-info">Noisemaker is the open source engine behind <a href="https://noisedeck.app/" target="_blank" rel="noopener">Noisedeck</a> and other <a href="https://noisefactor.io/" target="_blank" rel="noopener">Noise Factor</a> tools.</div>
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="loadingOverlay">rendering…</div>
            <div id="errorBanner"></div>
        </div>
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <script type="module" src="./demo.js"></script>
</body>
</html>
